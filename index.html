<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BottleMsg 🌊</title>
    <style>
        body {
            background: linear-gradient(180deg, #0f172a, #1e3a8a, #3b82f6);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contenedor {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #38bdf8;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }
        .botella {
            font-size: 70px;
            animation: flotar 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes flotar {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        textarea {
            width: 90%; height: 70px; border-radius: 10px; padding: 10px;
            margin: 15px 0; font-size: 16px; resize: none;
        }
        button {
            background: #f59e0b; color: #78350f; font-weight: bold;
            padding: 12px 20px; border: none; border-radius: 20px;
            cursor: pointer; font-size: 16px; margin: 5px;
        }
        button:hover { transform: scale(1.05); }
        .btn-recoger { background: #10b981; color: #064e3b; }
        .mensaje-pantalla {
            background: white; color: #1e293b; padding: 15px;
            border-radius: 10px; margin-top: 20px; text-align: left;
            font-style: italic; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>BottleMsg 🌊</h1>
        <p>¡Lanza mensajes al internet real con código!</p>
        
        <div class="botella">🍾</div>
        
        <textarea id="textoMensaje" placeholder="Escribe un mensaje para un extraño en internet..."></textarea>
        
        <div>
            <button onclick="lanzar()">¡Lanzar! 🚀</button>
            <button class="btn-recoger" onclick="recoger()">Recoger 🎣</button>
        </div>

        <div class="mensaje-pantalla">
            <b id="autor">Mensaje del océano:</b>
            <p id="contenido">"¡Haz clic en Recoger para pescar un mensaje real de internet!"</p>
        </div>
    </div>

    <script>
        // ESTA ES LA DIRECCIÓN SECRETA DE TU BASE DE DATOS PÚBLICA
        // Igual que cuando cambias la ruta de una canción en FNF
        const URL_CONEXION = "https://jsonbin.io"; 
        const MASTER_KEY = "\$2a\$10\$R8V7mfejHsh8M15oVb0WauL.x0XpM6X4B5r8w0I9oTf3g7V6l6u7y"; // Llave para entrar

        // Función para LANZAR el mensaje a internet
        async function lanzar() {
            let mensajeNuevo = document.getElementById("textoMensaje").value;
            if(mensajeNuevo.trim() === "") return alert("¡Escribe algo po'!");

            alert("Conectando con el océano de internet...");

            // 1. Primero descargamos los mensajes que ya existen en internet
            let respuesta = await fetch(URL_CONEXION, { headers: { "X-Master-Key": MASTER_KEY } });
            let datos = await respuesta.json();
            let listaMensajes = datos.record.mensajes;

            // 2. Le sumamos tu nuevo mensaje a la lista (como meter un personaje nuevo al Mod)
            listaMensajes.push(mensajeNuevo);

            // 3. Volvemos a subir la lista actualizada a internet
            await fetch(URL_CONEXION, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                body: JSON.stringify({ mensajes: listaMensajes })
            });

            alert("¡Tu botella fue lanzada con éxito y guardada en internet! 🎉");
            document.getElementById("textoMensaje").value = "";
        }

        // Función para RECOGER un mensaje random de internet
        async function recoger() {
            document.getElementById("contenido").innerText = "Pescando una botella... 🎣";
            
            // Descargamos la lista real desde internet
            let respuesta = await fetch(URL_CONEXION, { headers: { "X-Master-Key": MASTER_KEY } });
            let datos = await respuesta.json();
            let listaMensajes = datos.record.mensajes;

            // Elegimos uno al azar con matemáticas de JavaScript
            let random = Math.floor(Math.random() * listaMensajes.length);
            
            // Lo mostramos en la pantalla
            document.getElementById("autor").innerText = "Una botella flotando traía:";
            document.getElementById("contenido").innerText = `"${listaMensajes[random]}"`;
        }
    </script>

</body>
</html>
